name: Build Dorama Studio Mobile v2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q DoramaStudioMobileV2_fixed_v2_1.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: project/DoramaStudioMobileV2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoramaStudioMobile-v2-debug-apk
          path: project/DoramaStudioMobileV2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
